         inputs:
           version: 'latest'
           type: 'filesystem'

     - job:
       displayName:  Sonarqube
       steps:
       - task: SonarQubeAnalyze@8
         inputs:
           jdkversion: 'JAVA_HOME_17_X64'
       - task: SonarQubePublish@8
         inputs:
           pollingTimeoutSec: '300'

     - job:
       displayName:  Gitleak
       steps:
         - task
        
     - job: 
       displayName: Checkov
       steps:
         - task
        
     - job: 
       displayName: OWASP-ZAP
       steps:
         - task
     
     - job: 
       steps:
       displayName: PR-approval ----feature baranch- Dev-merge
         - task


  - stage: Init FMT Validate
    dependsOn: Scaning Tool
    condition: [Successed]
    jobs:
      - job: 
        steps:
        displayName: init FMT Validate
          - task
            
          - task
          - task

  - stage: Init Apply
    dependsOn: Init FMT Validate
    condition: [Successed]
    jobs:
      - job: 
        steps:
        displayName: init apply
          - task
            
